# The Xiaomi Redmi Note 10 Pro. Its SoC layer is xnu_kernel_qcom_common until a second Qualcomm SoC shows what differs.
device sweet
	title	Xiaomi Redmi Note 10 Pro (sweet)
	vendor	xiaomi
	soc	sm7150
	defconfig	sweet_defconfig
	cmdline	debug=0xc serial=3 cpus=8 keepsyms=1 -enable_kprintf_spam -noprogress rd=ufsroot0 unentitled_ios_sim_launch=1 ignition_level=1 wdt_test=no_user_checkin ufsrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 sweetfb_noconsole=1 sweetfb_hz=30
	adt	--highmem
	status build build-only: nobody here owns this phone; the kernel builds and has not been run by us
