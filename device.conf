# The Xiaomi Redmi Note 10 Pro. Its SoC layer is xnu_kernel_qcom_common until a second Qualcomm SoC shows what differs.
device sweet
	title	Xiaomi Redmi Note 10 Pro (sweet)
	vendor	xiaomi
	soc	sm7150
	soc_vendor	qcom
	machine	SWEET
	boot	abl
	gpu	none
	bootimg_version	2
	bootimg_pagesize	4096
	bootimg_base	0
	bootimg_kernel_offset	0x8000
	bootimg_ramdisk_offset	0x1000000
	bootimg_tags_offset	0x100
	bootimg_dtb_offset	0x1f00000
	bootimg_os_version	17.0.0
	bootimg_os_patch_level	2035-06
	bootimg_kernel	raw
	bootimg_cmdline	console=null
	defconfig	sweet_defconfig
	cmdline	cpus=8 unentitled_ios_sim_launch=1 ignition_level=1 ufsrw=1 rootrw=1 launchd_unsecure_cache=1 sweetfb_noconsole=1 sweetfb_hz=30
	adt	--ufs
	root_size	16g
	status build build-only: nobody here owns this phone; the kernel builds and has not been run by us
